# 把网站发布到 GitHub Pages：Settings → Pages → Source 选 "GitHub Actions" 后，每次推送都会自动更新网站。
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/modest-sagan-wtd7vz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
