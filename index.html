<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>24式简化太极拳 · 3D 教学</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>☯ 24式简化太极拳 <small>3D 人体演示教学</small></h1>
    <div class="modes">
      <button data-mode="form" class="on">单式教学</button>
      <button data-mode="all">连贯演练</button>
      <button id="btnGeneral" class="ghost">基本要求</button>
    </div>
  </header>

  <div class="layout">
    <aside class="list" id="formList" aria-label="招式列表"></aside>

    <main class="stage" id="stage">
      <div class="overlay top-left">
        <div id="formTitle" class="form-title"></div>
        <div class="legend"><i class="dot l"></i>左手左脚　<i class="dot r"></i>右手右脚</div>
      </div>
      <div class="overlay top-right views">
        <button data-view="back" class="on" title="从背后看，与演示人同向，最适合跟练">背面</button>
        <button data-view="front" title="面对演示人">正面</button>
        <button data-view="left" title="从演示人左侧看">左侧</button>
        <button data-view="right" title="从演示人右侧看">右侧</button>
        <button data-view="top" title="俯视看步法">俯视</button>
        <button data-view="hands" title="镜头拉近到双手，看清掌、拳、勾手和手指">手部特写</button>
      </div>
    </main>

    <section class="info" id="info" aria-label="动作讲解">
      <div class="info-num" id="infoNum"></div>
      <h2 id="infoName"></h2>
      <div class="status" id="status" hidden></div>
      <div class="info-actions">
        <button id="btnSpeakKey">🔊 朗读要领·呼吸·心法</button>
        <button id="btnStopVoice" class="ghost">停止朗读</button>
      </div>
      <h3>动作做法 <small>（讲到哪一步就高亮哪一步；点击可跳转）</small></h3>
      <ol id="infoSteps" class="steps"></ol>
      <div class="sec" id="secKey"><h3>动作要领</h3><p id="infoKey"></p></div>
      <div class="sec" id="secBreath"><h3>呼吸</h3><p id="infoBreath"></p></div>
      <div class="sec" id="secMind"><h3>心法</h3><p id="infoMind"></p></div>
    </section>
  </div>

  <footer class="controls">
    <div class="row">
      <button id="btnPrev" title="上一式（←）">⏮ 上一式</button>
      <button id="btnPlay" class="primary" title="播放/暂停（空格）">▶ 播放</button>
      <button id="btnNext" title="下一式（→）">下一式 ⏭</button>
      <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="进度">
      <span id="time" class="time">0:00 / 0:00</span>
    </div>
    <div class="row opts">
      <label id="teachWrap" title="逐步讲解：每一步先用语音讲解，讲完再进入下一步"><input type="checkbox" id="chkTeach" checked> 分步讲解</label>
      <label><input type="checkbox" id="chkVoice" checked> 普通话语音</label>
      <label><input type="checkbox" id="chkLoop"> 循环</label>
      <label>速度
        <select id="speed">
          <option value="0.4">0.4×</option>
          <option value="0.6">0.6×</option>
          <option value="0.8">0.8×</option>
          <option value="1" selected>1×</option>
          <option value="1.25">1.25×</option>
        </select>
      </label>
      <span class="sep"></span>
      <label title="视角随演示人转身而转动，始终保持相对位置"><input type="checkbox" id="chkFollow" checked> 视角跟随转身</label>
      <label title="左右镜像，面对面跟练时像照镜子"><input type="checkbox" id="chkMirror"> 镜像</label>
      <label><input type="checkbox" id="chkTrail"> 手部轨迹</label>
      <span class="sep"></span>
      <label><input type="checkbox" id="chkSkin" checked> 皮肤</label>
      <label><input type="checkbox" id="chkMuscle" checked> 肌肉</label>
      <label><input type="checkbox" id="chkBone" checked> 骨骼</label>
      <label title="左侧手脚偏蓝、右侧手脚偏橙，帮助分清左右"><input type="checkbox" id="chkTint" checked> 左右着色</label>
      <label>皮肤透明度 <input type="range" id="opacity" min="0.05" max="0.8" step="0.05" value="0.2"></label>
    </div>
    <div id="voiceWarn" class="warn" hidden>未检测到中文（普通话）语音包：文字讲解照常显示。如需语音，请使用 Chrome / Edge 浏览器，或在系统设置中安装“中文（中国大陆）”语音。</div>
  </footer>

  <script src="vendor/three.min.js"></script>
  <script src="js/figure.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
